<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo · Importech Col</title>
<meta name="description" content="Catálogo de productos Apple originales — iPhone, iPad, Mac, Apple Watch y AirPods. Importech Col, Bogotá.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#9898a0;--bg:#06060a;--card:#111115;--border:rgba(255,255,255,.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:#fff}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 80px}
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 0 26px;border-bottom:1px solid var(--border);margin-bottom:30px}
.brand{font-size:15px;font-weight:800;letter-spacing:.06em}
.brand span{color:var(--blue)}
h1{font-size:clamp(26px,4vw,40px);font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.sub{color:rgba(255,255,255,.45);font-size:14px;margin-bottom:26px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.fil{padding:8px 16px;border-radius:20px;border:1.5px solid var(--border);background:rgba(255,255,255,.03);color:rgba(255,255,255,.6);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer}
.fil.on{background:#fff;color:#111;border-color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:transform .25s,border-color .25s}
.card:hover{transform:translateY(-5px);border-color:rgba(152,152,160,.3)}
.ctop{height:200px;background:#f4f4f6;display:flex;align-items:center;justify-content:center;font-size:72px;overflow:hidden}
.ctop img{width:100%;height:100%;object-fit:contain;padding:16px}
.cbody{padding:16px 18px 18px}
.cat{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
.nm{font-size:16px;font-weight:700;margin:4px 0 2px}
.sp{font-size:12px;color:rgba(255,255,255,.42);margin-bottom:8px;min-height:16px}
.cond{display:inline-block;font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;background:rgba(152,152,160,.16);color:#cfcfd6;margin-bottom:10px}
.pr{font-size:19px;font-weight:800}
.pr small{display:block;font-size:11px;font-weight:400;color:rgba(255,255,255,.4)}
.empty{color:rgba(255,255,255,.4);padding:60px;text-align:center;grid-column:1/-1}
.foot{margin-top:60px;padding-top:20px;border-top:1px solid var(--border);font-size:12px;color:rgba(255,255,255,.3)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="brand" href="index.html">IMPOR<span>TECH</span></a>
    <a class="brand" href="index.html" style="font-size:13px;color:rgba(255,255,255,.5)">← Inicio</a>
  </div>
  <h1>Catálogo</h1>
  <div class="sub">Productos Apple originales — actualizado en tiempo real desde el panel.</div>
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"><div class="empty">Cargando…</div></div>
  <div class="foot">© <span id="yr"></span> Importech Col · CC Caribe, Bogotá · Envíos a toda Colombia</div>
</div>

<script src="assets/js/store-core.js?v=0" onload="/* helpers */"></script>
<script>
// Always-fresh load of the record-of-truth (cache-bust so publishes reflect immediately).
document.write('<script src="assets/js/products-data.js?v=' + Date.now() + '"><\/script>');
</script>
<script>
(function () {
  document.getElementById('yr').textContent = new Date().getFullYear();
  var SC = window.StoreCore;
  var all = (window.PRODUCTS || []).filter(function (p) { return p.published; });
  var emoji = { 'iPhone':'📱','iPad':'📲','Mac':'💻','Apple Watch':'⌚','AirPods':'🎧','Accesorios':'📦' };
  var cats = ['Todos'].concat(Array.from(new Set(all.map(function (p) { return p.category; }))));
  var active = 'Todos';

  function fromPrice(p) {
    // lowest achievable unit price across variant overrides, else base
    var prices = [p.price];
    ['storage', 'color'].forEach(function (d) {
      (p[d] || []).forEach(function (r) { if (r.price > 0) prices.push(r.price); });
    });
    return Math.min.apply(null, prices);
  }
  function totalUnits(p) {
    var dims = SC.dimsOf(p);
    if (!dims.length) return p.stock == null ? null : p.stock;
    return dims.reduce(function (s, d) {
      return s + (p[d] || []).reduce(function (a, r) { return a + (Number(r.units) || 0); }, 0);
    }, 0);
  }

  function renderFilters() {
    var f = document.getElementById('filters'); f.innerHTML = '';
    cats.forEach(function (c) {
      var b = document.createElement('button');
      b.className = 'fil' + (c === active ? ' on' : '');
      b.textContent = c;
      b.onclick = function () { active = c; renderFilters(); renderGrid(); };
      f.appendChild(b);
    });
  }
  function renderGrid() {
    var g = document.getElementById('grid'); g.innerHTML = '';
    var list = all.filter(function (p) { return active === 'Todos' || p.category === active; });
    if (!list.length) { g.innerHTML = '<div class="empty">No hay productos publicados en esta categoría.</div>'; return; }
    list.forEach(function (p) {
      var a = document.createElement('a');
      a.href = 'producto/' + p.slug + '.html';
      a.className = 'card';
      var media = (p.imgs && p.imgs.length) ? '<img src="' + p.imgs[0] + '" alt="">' : (emoji[p.category] || '📦');
      a.innerHTML =
        '<div class="ctop">' + media + '</div>' +
        '<div class="cbody">' +
          '<div class="cat">' + p.category + '</div>' +
          '<div class="nm">' + p.name + '</div>' +
          '<div class="sp">' + (p.spec || '') + '</div>' +
          '<span class="cond">' + p.condition + '</span>' +
          '<div class="pr"><small>Desde</small>' + SC.fmtCOP(fromPrice(p)) + '</div>' +
        '</div>';
      g.appendChild(a);
    });
  }
  renderFilters(); renderGrid();
})();
</script>
</body>
</html>
