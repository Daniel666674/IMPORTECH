<style>
:root{--blue:#9898a0;--blue-h:#6e6e76;--bg:#06060a;--card:#111115;--dborder:rgba(255,255,255,.08);--ok:#34c759;--warn:#ff9f0a}

.top{display:flex;align-items:center;justify-content:space-between;padding:6px 0 26px;border-bottom:1px solid var(--dborder);margin-bottom:32px}
.brand{font-size:15px;font-weight:800;letter-spacing:.06em}

.back{font-size:13px;color:rgba(255,255,255,.55)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:start}
.gallery{background:#f4f4f6;border-radius:22px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;padding:30px;overflow:hidden}
.gallery img{max-height:100%;object-fit:contain;filter:drop-shadow(0 16px 40px rgba(0,0,0,.18))}
.gallery .noimg{font-size:96px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);margin-bottom:10px}
h1{font-size:clamp(26px,4vw,40px);font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-bottom:8px}
.spec{font-size:14px;color:rgba(255,255,255,.5);margin-bottom:16px}
.cond{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:5px 12px;border-radius:20px;background:rgba(152,152,160,.16);border:1px solid rgba(152,152,160,.3);color:#fff;margin-bottom:20px}
.price{font-size:34px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.price small{display:block;font-size:12px;font-weight:400;color:rgba(255,255,255,.4);margin-bottom:4px}
.variant-block{margin:22px 0}
.variant-block h3{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-bottom:10px}
.opts{display:flex;flex-wrap:wrap;gap:9px}
.opt{padding:10px 16px;border-radius:12px;border:1.5px solid rgba(255,255,255,.14);background:rgba(255,255,255,.03);color:rgba(255,255,255,.72);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .18s}
.opt:hover{border-color:var(--blue)}
.opt.on{background:#fff;border-color:#fff;color:#111}
.opt.out{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.avail{margin:18px 0 6px;font-size:13.5px;font-weight:600;min-height:20px}
.avail.ok{color:var(--ok)}
.avail.low{color:var(--warn)}
.avail.pick{color:rgba(255,255,255,.5)}
.avail.none{color:#ff5a5a}
.cta{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:16px;border-radius:14px;background:var(--ok);color:#fff;font-size:15px;font-weight:700;margin-top:14px;transition:all .2s}
.cta:hover{filter:brightness(1.06);transform:translateY(-1px)}
.cta.disabled{background:#2a2a30;color:rgba(255,255,255,.4);pointer-events:none}
.notes{margin-top:22px;font-size:13px;color:rgba(255,255,255,.45);line-height:1.7}
.foot{margin-top:60px;padding-top:20px;border-top:1px solid var(--dborder);font-size:12px;color:rgba(255,255,255,.3);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

<script>window.PRODUCT = {"slug":"iphone-17-pro","name":"iPhone 17 Pro","category":"iPhone","model":"A3421","spec":"Chip A19 Pro · Cámara 48 MP · Titanio","price":6200000,"sku":"IP17P","condition":"Nuevo","notes":"Sellado, garantía oficial 1 año.","imgs":["assets/products/iphone-17-pro-cosmic-orange.jpg","assets/products/iphone-17-pro-white-titanium.jpg"],"storage":[{"label":"256GB","units":3},{"label":"512GB","units":2,"price":6900000}],"color":[{"label":"Cosmic Orange","units":3},{"label":"White Titanium","units":2,"price":6300000}],"published":true};</script>
<script src="../assets/js/store-core.js?v=3"></script>
<script>
(function () {
  var P = window.PRODUCT, SC = window.StoreCore;
  var WA = '573023232833';
  var sel = { storage: null, color: null };

  document.getElementById('yr').textContent = new Date().getFullYear();
  document.getElementById('cat').textContent = (P.brand ? P.brand + ' · ' : '') + P.category;
  document.getElementById('name').textContent = P.name;
  document.getElementById('spec').textContent = P.spec || '';
  document.getElementById('cond').textContent = P.condition || 'Nuevo';
  document.getElementById('sku').textContent = P.sku || '—';
  document.getElementById('notes').textContent = P.notes || '';

  var gal = document.getElementById('gallery');
  if (P.imgs && P.imgs.length) {
    var img = document.createElement('img');
    img.src = '../' + P.imgs[0]; img.alt = P.name;
    if (P.imgFit === 'cover') { img.style.objectFit = 'cover'; img.style.width = '100%'; img.style.height = '100%'; }
    gal.appendChild(img);
  } else {
    var emoji = { 'iPhone':'📱','iPad':'📲','Mac':'💻','Apple Watch':'⌚','AirPods':'🎧','Accesorios':'📦' };
    var d = document.createElement('div'); d.className = 'noimg';
    d.textContent = emoji[P.category] || '📦'; gal.appendChild(d);
  }

  var dims = SC.dimsOf(P);
  var vc = document.getElementById('variants');
  ['storage', 'color'].forEach(function (dim) {
    if (dims.indexOf(dim) === -1) return;
    var block = document.createElement('div'); block.className = 'variant-block';
    var h = document.createElement('h3');
    h.textContent = dim === 'storage' ? 'Almacenamiento' : 'Color';
    block.appendChild(h);
    var opts = document.createElement('div'); opts.className = 'opts';
    P[dim].forEach(function (row) {
      var b = document.createElement('button');
      b.className = 'opt' + ((row.units || 0) <= 0 ? ' out' : '');
      b.textContent = row.label;
      if ((row.units || 0) > 0) {
        b.addEventListener('click', function () {
          sel[dim] = (sel[dim] === row.label) ? null : row.label;
          render();
        });
      }
      b.dataset.dim = dim; b.dataset.label = row.label;
      opts.appendChild(b);
    });
    block.appendChild(opts); vc.appendChild(block);
  });

  function render() {
    document.querySelectorAll('.opt').forEach(function (b) {
      if (b.classList.contains('out')) return;
      b.classList.toggle('on', sel[b.dataset.dim] === b.dataset.label);
    });
    document.getElementById('price').textContent = SC.fmtCOP(SC.unitPrice(P, sel));

    var av = SC.availability(P, sel);
    var el = document.getElementById('avail');
    var cta = document.getElementById('cta');
    el.className = 'avail';
    if (!av.ready) {
      var names = av.need.map(function (d) { return d === 'storage' ? 'almacenamiento' : 'color'; });
      el.classList.add('pick');
      el.textContent = 'Selecciona ' + names.join(' y ') + ' para ver disponibilidad';
      cta.classList.add('disabled'); cta.textContent = 'Selecciona las opciones';
      cta.removeAttribute('href');
      return;
    }
    if (av.units === null) {
      el.classList.add('ok'); el.textContent = 'Disponible — consulta stock';
    } else if (av.units <= 0) {
      el.classList.add('none'); el.textContent = 'Agotado en esta combinación';
      cta.classList.add('disabled'); cta.textContent = 'Agotado';
      cta.removeAttribute('href'); return;
    } else if (av.units <= 3) {
      el.classList.add('low'); el.textContent = '⚡ Solo ' + av.units + ' disponibles';
    } else {
      el.classList.add('ok'); el.textContent = '✓ ' + av.units + ' disponibles';
    }

    var parts = [P.name];
    if (sel.storage) parts.push(sel.storage);
    if (sel.color) parts.push(sel.color);
    var msg = 'Hola Importech, me interesa el ' + parts.join(' · ') +
              ' (' + SC.fmtCOP(SC.unitPrice(P, sel)) + '). ¿Está disponible?';
    cta.classList.remove('disabled');
    cta.textContent = 'Comprar por WhatsApp';
    cta.href = 'https://wa.me/' + WA + '?text=' + encodeURIComponent(msg);
  }
  render();
})();
</script>
