<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Admin · Importech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#9898a0;--blue-h:#6e6e76;--bg:#0a0a0e;--panel:#131318;--card:#17171d;--border:rgba(255,255,255,.09);--ok:#34c759;--warn:#ff9f0a;--bad:#ff5a5a;--dirty:#e5a816}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:#fff;line-height:1.45;font-size:14px}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
.hidden{display:none!important}

/* LOGIN */
#login{max-width:420px;margin:8vh auto;padding:32px;background:var(--panel);border:1px solid var(--border);border-radius:18px}
#login h1{font-size:22px;font-weight:800;margin-bottom:6px}
#login p{color:rgba(255,255,255,.5);font-size:13px;margin-bottom:22px;line-height:1.6}
#login label{display:block;font-size:12px;font-weight:600;color:rgba(255,255,255,.6);margin:14px 0 6px}
#login input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:#0d0d12;color:#fff}
#login .row{display:flex;gap:10px}
#login .row>div{flex:1}
#loginBtn{width:100%;margin-top:20px;padding:13px;border-radius:10px;border:none;background:var(--blue);color:#fff;font-weight:700;font-size:14px}
#loginBtn:hover{background:var(--blue-h)}
#loginMsg{margin-top:14px;font-size:13px;min-height:18px}

/* SHELL */
header{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 26px;background:rgba(10,10,14,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);flex-wrap:wrap}
header .brand{font-size:15px;font-weight:800;letter-spacing:.05em}
header .brand span{color:var(--blue)}
header .repo{font-size:12px;color:rgba(255,255,255,.4)}
header .actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{padding:9px 16px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:#fff;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue)}
.btn.primary:hover{background:var(--blue-h)}
.btn.ok{background:var(--ok);border-color:var(--ok)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.pubwrap{position:relative}
.dirtybadge{position:absolute;top:-7px;right:-7px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--dirty);color:#111;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}

main{max-width:1180px;margin:0 auto;padding:24px 26px 80px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.toolbar h2{font-size:18px;font-weight:800}
.search{padding:9px 14px;border-radius:9px;border:1px solid var(--border);background:#0d0d12;color:#fff;min-width:220px}

/* PRODUCT LIST */
.plist{display:grid;grid-template-columns:1fr;gap:10px}
.prow{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:12px 14px;background:var(--card);border:1px solid var(--border);border-radius:12px}
.prow.dirty{border-color:var(--dirty)}
.pthumb{width:52px;height:52px;border-radius:9px;background:#f4f4f6;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:26px}
.pthumb img{width:100%;height:100%;object-fit:cover}
.pmeta .pn{font-weight:700;font-size:15px}
.pmeta .ps{font-size:12px;color:rgba(255,255,255,.45);margin-top:2px}
.badges{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.tag{font-size:10px;font-weight:700;letter-spacing:.03em;padding:3px 8px;border-radius:6px;background:rgba(255,255,255,.07);color:rgba(255,255,255,.6)}
.tag.pub{background:rgba(52,199,89,.16);color:#7ee89b}
.tag.unpub{background:rgba(255,90,90,.14);color:#ff9b9b}
.tag.dirty{background:rgba(229,168,22,.18);color:var(--dirty)}
.tag.cond{background:rgba(152,152,160,.16);color:#cfcfd6}
.pactions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pactions .btn{padding:7px 12px;font-size:12px}

/* EDITOR / MODAL */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:30px 16px}
.modal{width:100%;max-width:820px;background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:24px 26px 30px;margin:auto}
.modal h3{font-size:18px;font-weight:800;margin-bottom:18px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.field{display:flex;flex-direction:column}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:600;color:rgba(255,255,255,.6);margin-bottom:6px}
.field input,.field select,.field textarea{padding:11px 13px;border-radius:9px;border:1px solid var(--border);background:#0d0d12;color:#fff;width:100%}
.field textarea{min-height:70px;resize:vertical}
.hint{font-size:11px;color:rgba(255,255,255,.35);margin-top:5px}
.sectitle{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin:26px 0 10px;padding-top:18px;border-top:1px solid var(--border)}
.vrow{display:grid;grid-template-columns:1.3fr .8fr 1fr 1fr auto;gap:9px;align-items:end;margin-bottom:9px}
.vrow .field label{font-size:10px}
.vrow input{padding:9px 11px}
.vrow .rm{padding:9px 11px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--bad);font-weight:700}
.vhead{display:grid;grid-template-columns:1.3fr .8fr 1fr 1fr auto;gap:9px;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:6px}
.addrow{padding:8px 14px;border-radius:8px;border:1px dashed var(--border);background:transparent;color:rgba(255,255,255,.7);font-size:12px;font-weight:600;margin-top:4px}
.imglist{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.imgchip{display:flex;align-items:center;gap:6px;padding:5px 8px 5px 5px;border-radius:8px;background:#0d0d12;border:1px solid var(--border);font-size:11px}
.imgchip img{width:30px;height:30px;border-radius:5px;object-fit:cover}
.imgchip button{border:none;background:transparent;color:var(--bad);font-weight:800}
.modal-foot{display:flex;justify-content:space-between;gap:10px;margin-top:26px;flex-wrap:wrap}
.checkline{display:flex;align-items:center;gap:9px;font-size:13px;color:rgba(255,255,255,.75)}
.checkline input{width:auto}
#formErr{color:var(--bad);font-size:13px;font-weight:600;min-height:18px;flex:1}

/* SALE / availability preview */
.salebox{background:#0d0d12;border:1px solid var(--border);border-radius:12px;padding:16px;margin-top:8px}
.saleline{display:flex;justify-content:space-between;font-size:14px;padding:6px 0}
.saleline b{font-weight:800}
.mono{font-variant-numeric:tabular-nums}

/* LOG */
#log{position:fixed;bottom:0;left:0;right:0;max-height:38vh;overflow-y:auto;background:#08080b;border-top:1px solid var(--border);padding:12px 20px;font-family:ui-monospace,Menlo,monospace;font-size:12px;z-index:60}
#log .l{padding:2px 0;color:rgba(255,255,255,.7)}
#log .l.err{color:var(--bad)}
#log .l.ok{color:#7ee89b}
#log .l.step{color:var(--dirty)}
#logHead{display:flex;justify-content:space-between;position:sticky;top:0;background:#08080b;padding-bottom:6px;margin-bottom:4px;font-weight:700;color:#fff}
@media(max-width:720px){.fgrid{grid-template-columns:1fr}.vrow,.vhead{grid-template-columns:1fr 1fr;}.vhead{display:none}}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="login">
  <h1>Panel Importech</h1>
  <p>Ingresa un <b>GitHub Personal Access Token</b> con permiso <code>Contents: read/write</code> sobre este repositorio. El token se guarda solo en la sesión del navegador (sessionStorage) — nunca se sube al repo.</p>
  <div class="row">
    <div>
      <label>Owner</label>
      <input id="inOwner" value="Daniel666674" spellcheck="false">
    </div>
    <div>
      <label>Repo</label>
      <input id="inRepo" value="IMPORTECH" spellcheck="false">
    </div>
  </div>
  <label>Personal Access Token</label>
  <input id="inPat" type="password" placeholder="github_pat_..." spellcheck="false" autocomplete="off">
  <button id="loginBtn">Verificar y entrar →</button>
  <div id="loginMsg"></div>
</div>

<!-- ===================== APP ===================== -->
<div id="app" class="hidden">
  <header>
    <div>
      <div class="brand">IMPOR<span>TECH</span> · Admin</div>
      <div class="repo" id="repoLabel"></div>
    </div>
    <div class="actions">
      <button class="btn ghost" id="reloadBtn">↻ Recargar</button>
      <button class="btn" id="newBtn">+ Nuevo producto</button>
      <span class="pubwrap">
        <button class="btn primary" id="publishBtn" disabled>Publicar</button>
        <span class="dirtybadge hidden" id="dirtyCount">0</span>
      </span>
      <button class="btn ghost" id="logoutBtn">Salir</button>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <h2>Productos <span id="pcount" style="color:rgba(255,255,255,.4);font-weight:600"></span></h2>
      <input class="search" id="search" placeholder="Buscar por nombre, SKU, categoría…">
    </div>
    <div class="plist" id="plist"></div>
  </main>
</div>

<div id="log" class="hidden">
  <div id="logHead"><span>Registro</span><button class="btn ghost" style="padding:3px 10px;font-size:11px" onclick="document.getElementById('log').classList.add('hidden')">Ocultar</button></div>
  <div id="logBody"></div>
</div>

<script src="assets/js/store-core.js?v=1"></script>
<script>
/* ============================================================================
   CONFIG + STATE
   ============================================================================ */
const CFG = {
  owner: 'Daniel666674', repo: 'IMPORTECH', branch: 'main',
  dataPath: 'assets/js/products-data.js',
  templatePath: 'producto/_template.html',
  productDir: 'producto',
  imgDir: 'assets/products',
  siteBase: 'https://daniel666674.github.io/IMPORTECH'
};
const CATEGORIES = ['iPhone','iPad','Mac','Apple Watch','AirPods','Accesorios'];
const CONDITIONS = ['Nuevo','Seminuevo - Como nuevo','Seminuevo - Bueno'];
const STORAGE_PRESETS = ['64GB','128GB','256GB','512GB','1TB','2TB'];

let PAT = null;
let products = [];          // in-memory working copy
let version = 1;            // PRODUCTS_VERSION from data file
let dirty = new Set();      // slugs with unsaved-to-repo changes
let deleted = new Set();    // slugs to remove on publish (existed remotely)
let pendingImgs = {};       // { 'assets/products/x.jpg': base64 } staged uploads
let editing = null;         // slug being edited, or '__new__'

const SC = window.StoreCore;
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ============================================================================
   LOGGING
   ============================================================================ */
function logLine(msg, cls) {
  const box = $('#log'); box.classList.remove('hidden');
  const d = document.createElement('div');
  d.className = 'l' + (cls ? ' ' + cls : '');
  d.textContent = msg;
  $('#logBody').appendChild(d);
  box.scrollTop = box.scrollHeight;
}

/* ============================================================================
   GITHUB CONTENTS API
   ============================================================================ */
function ghUrl(path) {
  const enc = path.split('/').map(encodeURIComponent).join('/');
  return `https://api.github.com/repos/${CFG.owner}/${CFG.repo}/contents/${enc}`;
}
function ghHeaders() {
  return { 'Authorization': 'Bearer ' + PAT, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
}
function b64encodeUtf8(str) { return btoa(unescape(encodeURIComponent(str))); }
function b64decodeUtf8(b64) { return decodeURIComponent(escape(atob(b64.replace(/\n/g, '')))); }

async function ghGetFile(path) {
  const res = await fetch(ghUrl(path) + '?ref=' + CFG.branch, { headers: ghHeaders() });
  if (res.status === 404) return null;
  if (!res.ok) throw new Error('GET ' + path + ' → ' + res.status + ' ' + (await res.text()));
  const j = await res.json();
  return { sha: j.sha, text: j.content ? b64decodeUtf8(j.content) : '' };
}

// Fresh-sha + 409 retry, up to 4 attempts. NEVER reuse a stale sha.
async function commitFile(path, content, message, isBase64) {
  const body64 = isBase64 ? content : b64encodeUtf8(content);
  let lastErr = '';
  for (let attempt = 1; attempt <= 4; attempt++) {
    const cur = await ghGetFile(path);                 // fresh sha each cycle
    const payload = { message, content: body64, branch: CFG.branch };
    if (cur && cur.sha) payload.sha = cur.sha;
    const res = await fetch(ghUrl(path), { method: 'PUT', headers: ghHeaders(), body: JSON.stringify(payload) });
    if (res.ok) return await res.json();
    if (res.status === 409) { lastErr = await res.text(); await sleep(350 * attempt); continue; }
    throw new Error('PUT ' + path + ' → ' + res.status + ' ' + (await res.text()));
  }
  throw new Error('Conflicto persistente en ' + path + ' tras 4 intentos. ' + lastErr);
}

async function deleteFile(path, message) {
  const cur = await ghGetFile(path);
  if (!cur) return;                                    // already gone
  const res = await fetch(ghUrl(path), {
    method: 'DELETE', headers: ghHeaders(),
    body: JSON.stringify({ message, sha: cur.sha, branch: CFG.branch })
  });
  if (!res.ok && res.status !== 404) throw new Error('DELETE ' + path + ' → ' + res.status);
}

/* ============================================================================
   DATA FILE PARSE / SERIALIZE
   ============================================================================ */
function parseDataFile(text) {
  let ver = 1;
  const vm = text.match(/PRODUCTS_VERSION\s*=\s*(\d+)/);
  if (vm) ver = parseInt(vm[1], 10);
  const start = text.indexOf('[', text.indexOf('window.PRODUCTS'));
  const end = text.lastIndexOf(']');
  let arr = [];
  if (start !== -1 && end !== -1) {
    arr = JSON.parse(text.slice(start, end + 1));
  }
  return { version: ver, products: arr };
}
function serializeDataFile(list, ver) {
  return `/* products-data.js — RECORD OF TRUTH. AUTO-GENERATED por admin.html. No editar a mano.
   'cost' es interno y se elimina de cada página pública generada (toPublic()). */
window.PRODUCTS_VERSION = ${ver};
window.PRODUCTS = ${JSON.stringify(list, null, 2)};
`;
}

/* ============================================================================
   HELPERS
   ============================================================================ */
function slugify(s) {
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/["']/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60);
}
function escAttr(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function bySlug(slug) { return products.find(p => p.slug === slug); }
function markDirty(slug) { dirty.add(slug); refreshPublishState(); }

// Strip internal cost (top-level + per-row) before anything public.
function toPublic(p) {
  const c = JSON.parse(JSON.stringify(p));
  delete c.cost;
  ['storage', 'color'].forEach(dim => {
    if (Array.isArray(c[dim])) c[dim].forEach(r => { delete r.cost; });
  });
  return c;
}

/* ============================================================================
   PAGE GENERATION
   ============================================================================ */
function genPage(product, template) {
  const pub = toPublic(product);
  const title = `${product.name}${product.spec ? ' ' + product.spec : ''} · Importech`;
  const desc = `${product.name} ${product.condition} en Importech Col — ${product.spec || product.category}. Original con garantía. Bogotá, envíos a toda Colombia.`.slice(0, 175);
  const ogImg = (product.imgs && product.imgs.length)
    ? `${CFG.siteBase}/${product.imgs[0]}`
    : `${CFG.siteBase}/assets/importech-logo.jpg`;
  const robots = product.published ? 'index,follow' : 'noindex,nofollow';
  return template
    .replace(/\{\{TITLE\}\}/g, escAttr(title))
    .replace(/\{\{META_DESC\}\}/g, escAttr(desc))
    .replace(/\{\{ROBOTS\}\}/g, robots)
    .replace(/\{\{OG_IMAGE\}\}/g, escAttr(ogImg))
    .replace(/\{\{VERSION\}\}/g, String(version))
    .replace(/\{\{PRODUCT_JSON\}\}/g, JSON.stringify(pub));
}

/* ============================================================================
   RENDER — product list
   ============================================================================ */
function refreshPublishState() {
  const n = dirty.size + deleted.size;
  $('#publishBtn').disabled = n === 0;
  const badge = $('#dirtyCount');
  badge.textContent = n;
  badge.classList.toggle('hidden', n === 0);
}
function renderList() {
  const q = ($('#search').value || '').toLowerCase();
  const box = $('#plist'); box.innerHTML = '';
  const shown = products.filter(p =>
    !q || [p.name, p.sku, p.category, p.model].join(' ').toLowerCase().includes(q));
  $('#pcount').textContent = '(' + products.length + ')';
  shown.forEach(p => {
    const dims = SC.dimsOf(p);
    let stockTxt;
    if (!dims.length) stockTxt = (p.stock == null ? 'sin stock def.' : p.stock + ' u.');
    else stockTxt = dims.map(d => d === 'storage' ? 'Almac.' : 'Color').join(' + ') + ' · ' +
      dims.reduce((s, d) => s + (p[d] || []).reduce((a, r) => a + (Number(r.units) || 0), 0), 0) + ' u. total';
    const row = document.createElement('div');
    row.className = 'prow' + (dirty.has(p.slug) ? ' dirty' : '');
    const thumb = (p.imgs && p.imgs.length)
      ? `<img src="${escAttr(p.imgs[0])}" alt="">`
      : ({ 'iPhone':'📱','iPad':'📲','Mac':'💻','Apple Watch':'⌚','AirPods':'🎧','Accesorios':'📦' }[p.category] || '📦');
    row.innerHTML = `
      <div class="pthumb">${thumb}</div>
      <div class="pmeta">
        <div class="pn">${escAttr(p.name)}</div>
        <div class="ps">${escAttr(p.category)} · ${escAttr(p.spec || '')} · ${SC.fmtCOP(p.price)} · ${escAttr(stockTxt)}</div>
        <div class="badges">
          <span class="tag ${p.published ? 'pub' : 'unpub'}">${p.published ? 'Publicado' : 'Oculto'}</span>
          <span class="tag cond">${escAttr(p.condition)}</span>
          <span class="tag">SKU ${escAttr(p.sku || '—')}</span>
          ${dirty.has(p.slug) ? '<span class="tag dirty">● sin publicar</span>' : ''}
        </div>
      </div>
      <div class="pactions">
        <button class="btn" data-act="sale" data-slug="${escAttr(p.slug)}">Registrar venta</button>
        <button class="btn" data-act="pub" data-slug="${escAttr(p.slug)}">${p.published ? 'Ocultar' : 'Publicar'}</button>
        <button class="btn" data-act="edit" data-slug="${escAttr(p.slug)}">Editar</button>
        <button class="btn" data-act="del" data-slug="${escAttr(p.slug)}">Eliminar</button>
      </div>`;
    box.appendChild(row);
  });
  if (!shown.length) box.innerHTML = '<div style="color:rgba(255,255,255,.4);padding:30px;text-align:center">Sin productos.</div>';
}

/* ============================================================================
   EDITOR
   ============================================================================ */
function variantRowHtml(dim, row, basePrice, baseCost) {
  row = row || {};
  const isStorage = dim === 'storage';
  const labelCell = isStorage
    ? `<input list="storagePresets" value="${escAttr(row.label || '')}" data-k="label" placeholder="256GB">`
    : `<input value="${escAttr(row.label || '')}" data-k="label" placeholder="Negro">`;
  return `<div class="vrow" data-dim="${dim}">
    <div class="field"><label>${isStorage ? 'Capacidad' : 'Color'}</label>${labelCell}</div>
    <div class="field"><label>Stock</label><input type="number" step="1" min="0" value="${row.units != null ? row.units : ''}" data-k="units" placeholder="0"></div>
    <div class="field"><label>Precio (opc.)</label><input type="number" step="1" min="0" value="${row.price > 0 ? row.price : ''}" data-k="price" placeholder="Base: ${SC.fmtCOP(basePrice)}"></div>
    <div class="field"><label>Costo (opc.)</label><input type="number" step="1" min="0" value="${row.cost > 0 ? row.cost : ''}" data-k="cost" placeholder="Base: ${SC.fmtCOP(baseCost)}"></div>
    <button type="button" class="rm" onclick="this.closest('.vrow').remove()">✕</button>
  </div>`;
}
function addVariantRow(dim) {
  const bp = parseInt($('#f_price').value) || 0;
  const bc = parseInt($('#f_cost').value) || 0;
  const wrap = $(dim === 'storage' ? '#storageRows' : '#colorRows');
  wrap.insertAdjacentHTML('beforeend', variantRowHtml(dim, {}, bp, bc));
}
function renderImgList(imgs) {
  const box = $('#imgList'); box.innerHTML = '';
  (imgs || []).forEach((src, i) => {
    const chip = document.createElement('div'); chip.className = 'imgchip';
    const preview = pendingImgs[src] ? ('data:image/*;base64,' + pendingImgs[src]) : src;
    chip.innerHTML = `<img src="${escAttr(preview)}" alt=""><span>${escAttr(src.split('/').pop())}</span><button type="button" data-i="${i}">✕</button>`;
    chip.querySelector('button').onclick = () => { imgs.splice(i, 1); renderImgList(imgs); };
    box.appendChild(chip);
  });
  box._imgs = imgs;
}
function openEditor(slug) {
  editing = slug || '__new__';
  const p = slug ? JSON.parse(JSON.stringify(bySlug(slug))) : {
    name:'', category:'iPhone', model:'', spec:'', price:'', cost:'', sku:'',
    condition:'Nuevo', notes:'', imgs:[], storage:[], color:[], stock:'', published:true
  };
  const opt = (arr, v) => arr.map(o => `<option ${o === v ? 'selected' : ''}>${o}</option>`).join('');
  const ov = document.createElement('div'); ov.className = 'overlay'; ov.id = 'editorOverlay';
  ov.innerHTML = `<div class="modal">
    <h3>${slug ? 'Editar producto' : 'Nuevo producto'}</h3>
    <div class="fgrid">
      <div class="field"><label>Nombre *</label><input id="f_name" value="${escAttr(p.name)}"></div>
      <div class="field"><label>Categoría *</label><select id="f_category">${opt(CATEGORIES, p.category)}</select></div>
      <div class="field"><label>Modelo</label><input id="f_model" value="${escAttr(p.model)}"></div>
      <div class="field"><label>SKU</label><input id="f_sku" value="${escAttr(p.sku)}"></div>
      <div class="field full"><label>Especificación corta</label><input id="f_spec" value="${escAttr(p.spec)}"></div>
      <div class="field"><label>Precio base (COP) *</label><input id="f_price" type="number" step="1" min="0" value="${p.price}"></div>
      <div class="field"><label>Costo base (interno)</label><input id="f_cost" type="number" step="1" min="0" value="${p.cost}"></div>
      <div class="field"><label>Condición</label><select id="f_condition">${opt(CONDITIONS, p.condition)}</select></div>
      <div class="field"><label>Stock base (si NO usas variantes)</label><input id="f_stock" type="number" step="1" min="0" value="${p.stock != null ? p.stock : ''}" placeholder="—"></div>
      <div class="field full"><label>Notas</label><textarea id="f_notes">${escAttr(p.notes)}</textarea></div>
      <div class="field full">
        <label>Imágenes (ruta en el repo, p. ej. assets/products/foto.jpg)</label>
        <div class="imglist" id="imgList"></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <input id="imgPath" placeholder="assets/products/archivo.jpg" style="flex:1;min-width:200px;padding:9px 12px;border-radius:9px;border:1px solid var(--border);background:#0d0d12;color:#fff">
          <button type="button" class="btn" onclick="addImgByPath()">Añadir ruta</button>
          <label class="btn" style="cursor:pointer">Subir archivo<input type="file" id="imgFile" accept="image/*" class="hidden"></label>
        </div>
        <div class="hint">Los archivos subidos se confirman en el repo al Publicar (primero las fotos).</div>
      </div>
      <div class="field full checkline"><input type="checkbox" id="f_published" ${p.published ? 'checked' : ''}><label for="f_published" style="margin:0">Publicado (visible en la tienda)</label></div>
    </div>

    <div class="sectitle">Variante · Almacenamiento</div>
    <div class="vhead"><span>Capacidad</span><span>Stock</span><span>Precio</span><span>Costo</span><span></span></div>
    <div id="storageRows"></div>
    <button type="button" class="addrow" onclick="addVariantRow('storage')">+ Fila de almacenamiento</button>

    <div class="sectitle">Variante · Color</div>
    <div class="vhead"><span>Color</span><span>Stock</span><span>Precio</span><span>Costo</span><span></span></div>
    <div id="colorRows"></div>
    <button type="button" class="addrow" onclick="addVariantRow('color')">+ Fila de color</button>
    <div class="hint" style="margin-top:8px">Si defines <b>ambas</b> dimensiones, el cliente elige las dos y el stock disponible = el mínimo entre ellas.</div>

    <div class="modal-foot">
      <div id="formErr"></div>
      <div style="display:flex;gap:10px">
        <button type="button" class="btn ghost" onclick="closeEditor()">Cancelar</button>
        <button type="button" class="btn primary" onclick="saveEditor()">Guardar (en memoria)</button>
      </div>
    </div>
  </div>
  <datalist id="storagePresets">${STORAGE_PRESETS.map(s => '<option>' + s + '</option>').join('')}</datalist>`;
  document.body.appendChild(ov);
  (p.storage || []).forEach(r => $('#storageRows').insertAdjacentHTML('beforeend', variantRowHtml('storage', r, p.price || 0, p.cost || 0)));
  (p.color || []).forEach(r => $('#colorRows').insertAdjacentHTML('beforeend', variantRowHtml('color', r, p.price || 0, p.cost || 0)));
  renderImgList(p.imgs || []);
  $('#imgFile').addEventListener('change', handleImgFile);
  // keep row placeholders in sync when base price/cost change
  ['#f_price', '#f_cost'].forEach(sel => $(sel).addEventListener('input', syncRowPlaceholders));
}
function syncRowPlaceholders() {
  const bp = parseInt($('#f_price').value) || 0, bc = parseInt($('#f_cost').value) || 0;
  document.querySelectorAll('.vrow').forEach(r => {
    r.querySelector('[data-k="price"]').placeholder = 'Base: ' + SC.fmtCOP(bp);
    r.querySelector('[data-k="cost"]').placeholder = 'Base: ' + SC.fmtCOP(bc);
  });
}
function addImgByPath() {
  const v = $('#imgPath').value.trim();
  if (!v) return;
  const imgs = $('#imgList')._imgs; imgs.push(v); $('#imgPath').value = '';
  renderImgList(imgs);
}
function handleImgFile(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const b64 = reader.result.split(',')[1];
    const clean = slugify(file.name.replace(/\.[^.]+$/, '')) || ('img-' + Date.now());
    const ext = (file.name.match(/\.[^.]+$/) || ['.jpg'])[0];
    const path = CFG.imgDir + '/' + clean + ext;
    pendingImgs[path] = b64;
    const imgs = $('#imgList')._imgs; imgs.push(path); renderImgList(imgs);
  };
  reader.readAsDataURL(file);
}
function collectRows(dim) {
  const out = [];
  document.querySelectorAll(`#${dim}Rows .vrow`).forEach(r => {
    const label = r.querySelector('[data-k="label"]').value.trim();
    if (!label) return;
    const units = parseInt(r.querySelector('[data-k="units"]').value) || 0;
    const price = parseInt(r.querySelector('[data-k="price"]').value) || 0;
    const cost = parseInt(r.querySelector('[data-k="cost"]').value) || 0;
    const row = { label, units };
    if (price > 0) row.price = price;   // only emit overrides when actually set
    if (cost > 0) row.cost = cost;
    out.push(row);
  });
  return out;
}
function saveEditor() {
  const err = $('#formErr'); err.textContent = '';
  const name = $('#f_name').value.trim();
  const price = parseInt($('#f_price').value) || 0;
  if (!name) { err.textContent = 'El nombre es obligatorio.'; return; }
  if (price <= 0) { err.textContent = 'El precio base debe ser mayor a 0.'; return; }
  const storage = collectRows('storage');
  const color = collectRows('color');
  const stockRaw = $('#f_stock').value.trim();
  const rec = {
    name,
    category: $('#f_category').value,
    model: $('#f_model').value.trim(),
    spec: $('#f_spec').value.trim(),
    price,
    cost: parseInt($('#f_cost').value) || 0,
    sku: $('#f_sku').value.trim(),
    condition: $('#f_condition').value,
    notes: $('#f_notes').value.trim(),
    imgs: ($('#imgList')._imgs || []).slice(),
    storage, color,
    published: $('#f_published').checked
  };
  if (!storage.length && !color.length && stockRaw !== '') rec.stock = parseInt(stockRaw) || 0;

  if (editing === '__new__') {
    let slug = slugify(name);
    let base = slug, i = 2;
    while (bySlug(slug)) { slug = base + '-' + (i++); }
    rec.slug = slug;
    products.push(rec);
  } else {
    rec.slug = editing;
    const idx = products.findIndex(p => p.slug === editing);
    products[idx] = rec;
  }
  markDirty(rec.slug);
  closeEditor();
  renderList();
}
function closeEditor() { const o = $('#editorOverlay'); if (o) o.remove(); editing = null; }

/* ============================================================================
   REGISTRAR VENTA (internal) — uses shared StoreCore pricing/availability
   ============================================================================ */
function openSale(slug) {
  const p = bySlug(slug);
  const dims = SC.dimsOf(p);
  const sel = { storage: null, color: null };
  const ov = document.createElement('div'); ov.className = 'overlay'; ov.id = 'saleOverlay';
  const dimOpts = dim => `<div class="field"><label>${dim === 'storage' ? 'Almacenamiento' : 'Color'}</label>
    <select data-dim="${dim}"><option value="">— elige —</option>${(p[dim] || []).map(r => `<option value="${escAttr(r.label)}">${escAttr(r.label)} (${r.units} u.)</option>`).join('')}</select></div>`;
  ov.innerHTML = `<div class="modal" style="max-width:520px">
    <h3>Registrar venta · ${escAttr(p.name)}</h3>
    <div class="fgrid">${dims.map(dimOpts).join('') || '<div class="hint">Producto simple (sin variantes).</div>'}</div>
    <div class="salebox" id="saleBox"></div>
    <div class="modal-foot">
      <div id="saleErr" style="color:var(--bad);font-size:13px;flex:1"></div>
      <div style="display:flex;gap:10px">
        <button class="btn ghost" onclick="closeSale()">Cancelar</button>
        <button class="btn ok" id="saleConfirm">Confirmar venta (−1)</button>
      </div>
    </div>
  </div>`;
  document.body.appendChild(ov);
  const upd = () => {
    ov.querySelectorAll('select[data-dim]').forEach(s => { sel[s.dataset.dim] = s.value || null; });
    const price = SC.unitPrice(p, sel);
    const cost = SC.unitCost(p, sel);
    const av = SC.availability(p, sel);
    let availTxt;
    if (!av.ready) availTxt = 'Elige ' + av.need.map(d => d === 'storage' ? 'almacenamiento' : 'color').join(' y ');
    else if (av.units == null) availTxt = 'consultar';
    else availTxt = av.units + ' disponibles';
    const margin = (price && cost) ? (price - cost) : null;
    $('#saleBox').innerHTML = `
      <div class="saleline"><span>Precio unitario</span><b class="mono">${SC.fmtCOP(price)}</b></div>
      <div class="saleline"><span>Costo (interno)</span><span class="mono">${SC.fmtCOP(cost)}</span></div>
      <div class="saleline"><span>Margen</span><b class="mono" style="color:var(--ok)">${margin != null ? SC.fmtCOP(margin) : '—'}</b></div>
      <div class="saleline"><span>Disponibilidad</span><b>${availTxt}</b></div>`;
    $('#saleConfirm').disabled = !(av.ready && (av.units == null || av.units > 0));
  };
  ov.querySelectorAll('select[data-dim]').forEach(s => s.addEventListener('change', upd));
  upd();
  $('#saleConfirm').onclick = () => {
    ov.querySelectorAll('select[data-dim]').forEach(s => { sel[s.dataset.dim] = s.value || null; });
    const av = SC.availability(p, sel);
    if (!av.ready) { $('#saleErr').textContent = 'Selecciona todas las variantes.'; return; }
    dims.forEach(d => {
      const row = (p[d] || []).find(r => r.label === sel[d]);
      if (row) row.units = Math.max(0, (Number(row.units) || 0) - 1);
    });
    if (!dims.length && p.stock != null) p.stock = Math.max(0, p.stock - 1);
    markDirty(p.slug); closeSale(); renderList();
    logLine('Venta registrada: ' + p.name + ' ' + [sel.storage, sel.color].filter(Boolean).join(' ') + ' — stock actualizado (sin publicar).', 'ok');
  };
}
function closeSale() { const o = $('#saleOverlay'); if (o) o.remove(); }

/* ============================================================================
   DELETE / TOGGLE
   ============================================================================ */
async function remoteHasProduct(slug) {
  // was it in the last loaded remote snapshot? track via _remoteSlugs
  return remoteSlugs.has(slug);
}
function deleteProduct(slug) {
  const p = bySlug(slug);
  if (!p) return;
  if (!confirm('¿Eliminar "' + p.name + '"? Se quitará de la tienda al publicar.')) return;
  products = products.filter(x => x.slug !== slug);
  dirty.delete(slug);
  if (remoteSlugs.has(slug)) deleted.add(slug);   // only need repo deletion if it exists remotely
  refreshPublishState(); renderList();
}
function togglePublish(slug) {
  const p = bySlug(slug); if (!p) return;
  p.published = !p.published; markDirty(slug); renderList();
}

/* ============================================================================
   PUBLISH — ordered, merge-onto-fresh-remote
   ============================================================================ */
let publishing = false;
async function publish() {
  if (publishing) return;
  if (dirty.size === 0 && deleted.size === 0) return;
  publishing = true; $('#publishBtn').disabled = true; $('#publishBtn').textContent = 'Publicando…';
  logLine('──────── PUBLICAR ' + new Date().toLocaleTimeString() + ' ────────', 'step');
  try {
    // 1) PHOTOS FIRST — commit any staged uploads so pages/data can reference them.
    const imgPaths = Object.keys(pendingImgs);
    if (imgPaths.length) {
      logLine('1) Subiendo ' + imgPaths.length + ' foto(s)…', 'step');
      for (const path of imgPaths) {
        await commitFile(path, pendingImgs[path], 'admin: foto ' + path, true);
        logLine('   ✓ ' + path, 'ok');
      }
      pendingImgs = {};
    }

    // 2) Re-fetch CURRENT remote data fresh, then merge ONLY dirty/deleted onto it.
    logLine('2) Releyendo products-data.js remoto y fusionando cambios…', 'step');
    const cur = await ghGetFile(CFG.dataPath);
    let remote = cur ? parseDataFile(cur.text).products : [];
    const map = new Map(remote.map(p => [p.slug, p]));
    dirty.forEach(slug => { const local = bySlug(slug); if (local) map.set(slug, local); });
    deleted.forEach(slug => map.delete(slug));
    const merged = Array.from(map.values());
    version = (cur ? parseDataFile(cur.text).version : 0) + 1;   // bump cache-bust version

    // 3) Generate + commit each dirty product's public page (published→write, hidden→remove).
    logLine('3) Generando páginas de producto…', 'step');
    const tpl = await ghGetFile(CFG.templatePath);
    if (!tpl) throw new Error('Falta la plantilla ' + CFG.templatePath);
    for (const slug of dirty) {
      const p = bySlug(slug);
      const page = CFG.productDir + '/' + slug + '.html';
      if (p && p.published) {
        await commitFile(page, genPage(p, tpl.text), 'admin: página ' + slug);
        logLine('   ✓ ' + page, 'ok');
      } else {
        await deleteFile(page, 'admin: ocultar ' + slug);
        logLine('   ✓ (oculto) ' + page, 'ok');
      }
    }
    for (const slug of deleted) {
      await deleteFile(CFG.productDir + '/' + slug + '.html', 'admin: eliminar ' + slug);
      logLine('   ✓ (eliminado) ' + slug, 'ok');
    }

    // 4) products-data.js — RECORD OF TRUTH. Committed AFTER photos + pages.
    logLine('4) Confirmando products-data.js (registro de verdad)…', 'step');
    await commitFile(CFG.dataPath, serializeDataFile(merged, version), 'admin: publicar datos (v' + version + ')');
    logLine('   ✓ ' + CFG.dataPath + ' (v' + version + ')', 'ok');

    // 5) Less-critical: sitemap. Never blocks the core commit above.
    try {
      const urls = merged.filter(p => p.published).map(p =>
        `  <url><loc>${CFG.siteBase}/${CFG.productDir}/${p.slug}.html</loc></url>`).join('\n');
      const sitemap = `<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n${urls}\n</urlset>\n`;
      await commitFile('sitemap.xml', sitemap, 'admin: sitemap');
      logLine('5) ✓ sitemap.xml', 'ok');
    } catch (e) { logLine('5) sitemap omitido: ' + e.message, 'err'); }

    // success — reset working state, refresh remote snapshot
    products = merged;
    remoteSlugs = new Set(merged.map(p => p.slug));
    dirty.clear(); deleted.clear();
    refreshPublishState(); renderList();
    logLine('✅ Publicado. GitHub Pages tarda ~20–90s en reflejar los cambios.', 'ok');
    alert('Publicado con éxito (v' + version + ').\nGitHub Pages tarda ~20–90s en actualizar el sitio.');
  } catch (e) {
    logLine('✗ ERROR: ' + e.message, 'err');
    alert('Error al publicar:\n' + e.message + '\n\nRevisa el registro. Los cambios locales NO se perdieron; puedes reintentar.');
  } finally {
    publishing = false; $('#publishBtn').textContent = 'Publicar'; refreshPublishState();
  }
}

/* ============================================================================
   BOOT / AUTH
   ============================================================================ */
let remoteSlugs = new Set();
async function loadData() {
  logLine('Cargando products-data.js…');
  const cur = await ghGetFile(CFG.dataPath);
  if (cur) {
    const parsed = parseDataFile(cur.text);
    products = parsed.products; version = parsed.version;
  } else { products = []; version = 1; }
  remoteSlugs = new Set(products.map(p => p.slug));
  dirty.clear(); deleted.clear();
  refreshPublishState(); renderList();
  logLine('✓ ' + products.length + ' productos cargados (v' + version + ').', 'ok');
}
async function doLogin() {
  const msg = $('#loginMsg'); msg.textContent = 'Verificando…'; msg.style.color = 'rgba(255,255,255,.6)';
  CFG.owner = $('#inOwner').value.trim(); CFG.repo = $('#inRepo').value.trim();
  PAT = $('#inPat').value.trim();
  if (!PAT) { msg.textContent = 'Ingresa un token.'; msg.style.color = 'var(--bad)'; return; }
  try {
    const res = await fetch('https://api.github.com/repos/' + CFG.owner + '/' + CFG.repo, { headers: ghHeaders() });
    if (!res.ok) throw new Error('Sin acceso al repo (' + res.status + '). Verifica token/permisos.');
    sessionStorage.setItem('it_pat', PAT);
    sessionStorage.setItem('it_owner', CFG.owner);
    sessionStorage.setItem('it_repo', CFG.repo);
    enterApp();
  } catch (e) { msg.textContent = e.message; msg.style.color = 'var(--bad)'; }
}
function enterApp() {
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('#repoLabel').textContent = CFG.owner + '/' + CFG.repo + ' · ' + CFG.branch;
  loadData().catch(e => logLine('✗ ' + e.message, 'err'));
}
function logout() { sessionStorage.removeItem('it_pat'); location.reload(); }

// events
$('#loginBtn').onclick = doLogin;
$('#inPat').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
$('#newBtn').onclick = () => openEditor(null);
$('#reloadBtn').onclick = () => { if (!dirty.size || confirm('Hay cambios sin publicar. ¿Recargar y descartarlos?')) loadData(); };
$('#publishBtn').onclick = publish;
$('#logoutBtn').onclick = logout;
$('#search').addEventListener('input', renderList);
$('#plist').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const slug = b.dataset.slug;
  if (b.dataset.act === 'edit') openEditor(slug);
  else if (b.dataset.act === 'del') deleteProduct(slug);
  else if (b.dataset.act === 'pub') togglePublish(slug);
  else if (b.dataset.act === 'sale') openSale(slug);
});

// resume session
(function () {
  const saved = sessionStorage.getItem('it_pat');
  if (saved) {
    PAT = saved;
    CFG.owner = sessionStorage.getItem('it_owner') || CFG.owner;
    CFG.repo = sessionStorage.getItem('it_repo') || CFG.repo;
    $('#inOwner').value = CFG.owner; $('#inRepo').value = CFG.repo;
    enterApp();
  }
})();
</script>
</body>
</html>
